name: Hostinger Shared Hosting Deployment

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        type: choice
        options:
          - staging
          - production
        default: 'staging'
      dry_run:
        description: 'Dry run deployment (validate & test without syncing files)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate (CI)
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.resolve-env.outputs.target_env }}
      dry_run: ${{ steps.resolve-env.outputs.dry_run }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Target Environment and Execution Mode
        id: resolve-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = true ]; then
              echo "dry_run=true" >> $GITHUB_OUTPUT
            else
              echo "dry_run=false" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_env=production" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          else
            echo "target_env=staging" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Laravel Pint Check
        run: ./vendor/bin/pint --test

      - name: Run TypeScript Type Check
        run: npm run types

      - name: Run Script Unit Tests
        run: npx vitest run tests/Unit/Scripts/

      - name: Build Frontend Assets
        run: npm run build

      - name: Setup SQLite Testing Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env
          php artisan migrate:fresh --seed --force

      - name: Run Pest Tests
        run: ./vendor/bin/pest

  build-and-deploy:
    name: Build and Deploy (CD)
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: ${{ needs.quality-gate.outputs.target_env }}
    env:
      TARGET_ENV: ${{ needs.quality-gate.outputs.target_env }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Deployment Context
        run: |
          echo "[INFO] Deployment Target Environment: ${{ env.TARGET_ENV }}"
          echo "[INFO] Dry Run Mode: ${{ needs.quality-gate.outputs.dry_run }}"

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install Production Backend Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Prepare Public Payload for Hostinger
        env:
          REMOTE_CORE_PATH: ${{ secrets.HOSTINGER_REMOTE_CORE_PATH }}
          REMOTE_PUBLIC_PATH: ${{ secrets.HOSTINGER_REMOTE_PUBLIC_PATH }}
        run: |
          cp -r public public_dist
          node scripts/hostinger-prepare-public.js public_dist "$REMOTE_CORE_PATH" "$REMOTE_PUBLIC_PATH"

      - name: Report Dry Run Status
        if: ${{ needs.quality-gate.outputs.dry_run == 'true' }}
        run: |
          echo "[INFO] Dry run deployment enabled. Build and packaging completed successfully. Skipping file synchronization and remote execution."

      - name: Setup SSH Agent
        if: ${{ needs.quality-gate.outputs.dry_run != 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Configure Known Hosts
        if: ${{ needs.quality-gate.outputs.dry_run != 'true' }}
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-65002}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create Remote Pre-Deploy Backup Snapshot
        if: ${{ needs.quality-gate.outputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          command_timeout: 5m
          script: |
            CORE_PATH="${{ secrets.HOSTINGER_REMOTE_CORE_PATH }}"
            CORE_PATH="${CORE_PATH%/}"
            BACKUP_PATH="${CORE_PATH}_backup"
            if [ -d "$CORE_PATH" ]; then
              echo "[INFO] Creating snapshot backup from $CORE_PATH to $BACKUP_PATH"
              mkdir -p "$BACKUP_PATH"
              rsync -a --delete --exclude='storage/' "$CORE_PATH/" "$BACKUP_PATH/" || true
            else
              echo "[INFO] Core path $CORE_PATH does not exist yet. Skipping snapshot backup."
            fi

      - name: Synchronize Application Core via RSync
        if: ${{ needs.quality-gate.outputs.dry_run != 'true' }}
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          REMOTE_CORE_PATH: ${{ secrets.HOSTINGER_REMOTE_CORE_PATH }}
        run: |
          PORT="${SSH_PORT:-65002}"
          TARGET_DIR="${REMOTE_CORE_PATH%/}/"
          rsync -avz \
            -e "ssh -p $PORT -o StrictHostKeyChecking=yes" \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='.superpowers/' \
            --exclude='docs/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='public/' \
            --exclude='public_dist/' \
            --exclude='.env*' \
            --exclude='phpunit.xml' \
            --exclude='pest.xml' \
            --exclude='README.md' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR"

      - name: Synchronize Public Web Root via RSync
        if: ${{ needs.quality-gate.outputs.dry_run != 'true' }}
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          REMOTE_PUBLIC_PATH: ${{ secrets.HOSTINGER_REMOTE_PUBLIC_PATH }}
        run: |
          PORT="${SSH_PORT:-65002}"
          TARGET_DIR="${REMOTE_PUBLIC_PATH%/}/"
          rsync -avz \
            -e "ssh -p $PORT -o StrictHostKeyChecking=yes" \
            --exclude='storage' \
            public_dist/ "$SSH_USER@$SSH_HOST:$TARGET_DIR"

      - name: Execute Post-Deployment Remote Commands
        if: ${{ needs.quality-gate.outputs.dry_run != 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          command_timeout: 10m
          script: |
            CORE_PATH="${{ secrets.HOSTINGER_REMOTE_CORE_PATH }}"
            CORE_PATH="${CORE_PATH%/}"
            PUBLIC_PATH="${{ secrets.HOSTINGER_REMOTE_PUBLIC_PATH }}"
            PUBLIC_PATH="${PUBLIC_PATH%/}"
            cd "$CORE_PATH" || { echo "[ERROR] Failed to navigate to $CORE_PATH"; exit 1; }
            PHP_BIN="php"
            if command -v php >/dev/null 2>&1; then
              PHP_BIN="php"
            elif [ -x /usr/bin/php ]; then
              PHP_BIN="/usr/bin/php"
            elif [ -x /opt/alt/php82/usr/bin/php ]; then
              PHP_BIN="/opt/alt/php82/usr/bin/php"
            elif [ -x /opt/alt/php83/usr/bin/php ]; then
              PHP_BIN="/opt/alt/php83/usr/bin/php"
            elif [ -x /opt/alt/php84/usr/bin/php ]; then
              PHP_BIN="/opt/alt/php84/usr/bin/php"
            fi
            echo "[INFO] Using PHP CLI: $($PHP_BIN -v | head -n 1)"
            APP_URL="${{ secrets.APP_URL }}"
            APP_URL="${APP_URL%/}"

            if [ ! -f .env ]; then
              echo "[WARNING] .env file not found in $CORE_PATH. Initializing default .env..."
              touch .env
              echo "APP_NAME=\"SIM Litabmas Standalone\"" >> .env
              echo "APP_ENV=production" >> .env
              echo "APP_KEY=" >> .env
              echo "APP_DEBUG=false" >> .env
              echo "APP_URL=\"${APP_URL}\"" >> .env
              echo "LOG_CHANNEL=stack" >> .env
              echo "LOG_LEVEL=info" >> .env
              echo "DB_CONNECTION=sqlite" >> .env
              echo "SESSION_DRIVER=database" >> .env
              echo "QUEUE_CONNECTION=database" >> .env
              echo "CACHE_STORE=database" >> .env
            fi

            if ! grep -qE '^APP_KEY=base64:.+' .env; then
              echo "[INFO] APP_KEY is missing or empty in .env. Generating application key..."
              if ! grep -q '^APP_KEY=' .env; then
                echo "APP_KEY=" >> .env
              fi
              "$PHP_BIN" artisan key:generate --force
              echo "[PASSED] Application encryption key generated successfully."
            else
              echo "[INFO] Application encryption key is already configured in .env."
            fi

            mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views
            touch storage/logs/laravel.log
            "$PHP_BIN" artisan down --retry=60 || true
            chmod -R 775 storage bootstrap/cache
            chmod 644 .env || true
            "$PHP_BIN" artisan migrate --force
            ln -sfn "${CORE_PATH}/storage/app/public" "${PUBLIC_PATH}/storage" || "$PHP_BIN" artisan storage:link
            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan optimize
            "$PHP_BIN" artisan up
            if ! curl -sSfL -k -m 15 "${APP_URL}" > /dev/null; then
              echo "[ERROR] Smoke check failed. Showing response headers:"
              curl -sIL -k -m 15 "${APP_URL}" | head -n 25 || true
              echo "[DIAGNOSTIC] Response body:"
              curl -sSL -k -m 15 "${APP_URL}" | head -n 35 || true
              echo "[DIAGNOSTIC] Recent entries from storage/logs/:"
              tail -n 40 storage/logs/*.log 2>/dev/null || true
              exit 1
            fi
            echo "[PASSED] Smoke test succeeded"

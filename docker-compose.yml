services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: litabmas-app:latest
    container_name: litabmas_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=litabmas
      - DB_USERNAME=litabmas
      - DB_PASSWORD=litabmas_password
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - litabmas_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: litabmas_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - litabmas_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: litabmas_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: litabmas
      MYSQL_USER: litabmas
      MYSQL_PASSWORD: litabmas_password
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - litabmas_db_data:/var/lib/mysql
    networks:
      - litabmas_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  litabmas_net:
    driver: bridge

volumes:
  litabmas_db_data:
    driver: local
